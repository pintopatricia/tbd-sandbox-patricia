fragment raceWithRaceRunnersPerformance on Race {
  __typename
  urn
  startTime
  name
  raceId
  verdict
  winningTime
  details {
    scheduledTime
    distance {
      miles
      furlongs
      yards
    }
    numberOfRunners
    numberOfNonRunners
    raceClass
    raceDetailsTitle: title
    numberOfParticipants
    going
    status
    type
    resultType
  }
  runners {
    ...raceRunnerHorsePerformance
  }
  raceKind {
    ...raceKind
  }
  meeting {
    ...meeting
  }
}
