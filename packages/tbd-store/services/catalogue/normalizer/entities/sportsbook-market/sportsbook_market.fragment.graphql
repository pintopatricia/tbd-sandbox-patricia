fragment sportsbookMarket on SportsbookMarket {
  __typename
  urn
  name
  marketType
  marketTypeName
  bettingType
  hierarchy {
    ...marketHierarchy
  }
  sport {
    ...sport
  }
  runners {
    __typename
    runnerURN
    name
    selectionId
    handicap
    resultType
  }
  isOddsboostMarketType
  isAutomaticEachWayMarketType
  isSuperSub
  isAccaFreezeEligible
}
