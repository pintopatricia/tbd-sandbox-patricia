fragment matchStatSelectionCard on MatchStatSelectionCard {
  __typename
  urn
  matchStatTitle: title {
    playerNames
    combiner
  }
  matchStatSubtitle: subtitle
  market {
    ...sportsbookMarket
  }
  runner {
    runnerURN
  }
  statsDescription
  incidentType
}

fragment matchStatSelectionCardPartial on MatchStatSelectionCard {
  __typename
  urn
}
