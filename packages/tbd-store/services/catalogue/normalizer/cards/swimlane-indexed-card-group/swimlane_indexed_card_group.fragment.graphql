fragment swimlaneIndexedCardGroup on SwimlaneIndexedCardGroup {
  __typename
  urn
  cardGroupTitle: title
  displayName {
    translationKey
  }
  icon {
    vector
  }
  viewAll {
    label
    icon
    viewLink {
      viewUrn
      viewUrl
    }
  }
  hint
  swimlaneItems: items {
    ...fullSwimlaneIndexedCardGroupItems
  }
}

