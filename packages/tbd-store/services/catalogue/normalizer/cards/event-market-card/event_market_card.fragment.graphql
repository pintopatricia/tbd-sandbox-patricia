fragment eventMarketCard on EventMarketCard {
  __typename
  urn
  eventViewLink {
    viewUrn
    viewUrl
  }
  runnerViewLinks {
    runnerUrn
    viewUrl
    viewUrn
  }
  title
  sportevent {
    ...sportEvent
  }
  statsPebble {
    urn
  }
  fixture {
    ...fixture
  }
  displayRunners {
    exchange {
      market {
        ...exchangeMarketLiveData
      }
      runners {
        runnerURN
      }
    }
    sportsbook {
      market {
        ...sportsbookMarketLiveData
      }
      runners {
        runnerURN
      }
    }
  }
  videoAvailable
  isSuperSubEligible
  tabLink {
    label
    icon {
        id
        category
         __typename 
    }
    tabViewLink {
      viewUrn
      viewUrl
    }
  }
  marketPromo: promotion {
    title
    description
    signposting
  }
}

