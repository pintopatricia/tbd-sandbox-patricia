fragment competitionView on CompetitionView {
  __typename
  urn
  url
  title
  canonicalUrl
  competition {
    ...competitionBasic
  }
  items(autoPageSize: true) {
    ...viewItems
  }
  partialItems: items {
    ...viewItemsPartial
  }
  bottomBar @include(if: $withBottomBar) {
    ...bottomBar
  }
  leftSidebar @include(if: $withLeftSidebar) {
    ...leftSidebar
  }
  regulatoryData @include(if: $withRegulatoryData) {
    ...regulatoryData
  }
  xsellBar {
    ...XSellBar
  }
}
