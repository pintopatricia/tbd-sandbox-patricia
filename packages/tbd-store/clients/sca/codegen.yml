schema: http://scabf.nxt.internal/graphql
documents:
  - ./packages/tbd-store/services/sca/**/*.graphql
  - ./packages/tbd-store/clients/sca/**/*.graphql
config:
  avoidOptionals: true
generates:
  packages/tbd-store/clients/sca/sports-content-api-response-types.ts:
    plugins:
      - add:
         content: "/**\n* DON'T EDIT THIS FILE\n* THIS FILE IS GENERATED BY THE TASK `generate-sca-response-types`\n*/"
      - typescript
      - typescript-operations
    config:
     inlineFragmentTypes: combine
     namingConvention:
        enumValues: keep
        transformUnderscore: true
