schema: http://blhsbg.nxt.internal/graphql 
documents:
  - ./packages/tbd-store/services/blh/**/*.graphql
  - ./packages/tbd-store/clients/blh/**/*.graphql
config:
  avoidOptionals: true
generates:
  packages/tbd-store/clients/blh/bet-live-hypotheticals-response-types.ts:
    plugins:
      - add:
         content: "/**\n* DON'T EDIT THIS FILE\n* THIS FILE IS GENERATED BY THE TASK `generate-blh-response-types`\n*/"
      - typescript
      - typescript-operations
    config:
     inlineFragmentTypes: combine
     namingConvention:
        enumValues: keep
        transformUnderscore: true
