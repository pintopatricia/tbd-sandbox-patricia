query ObbQuotes(
  $quotesRequestInput: QuotesRequestInput!
  $throttlesOn: [String!]
  $throttlesOff: [String!]
  $productExclusions: [ProductExclusion!]
)
@productExclusions(productExclusions: $productExclusions)
@throttlesOn(throttlesOn: $throttlesOn)
@throttlesOff(throttlesOff: $throttlesOff) {
  obb {
    quotes(quotesRequestInput: $quotesRequestInput) {
      eventId {
        id
        supplier
      }
      prices {
        id
        price {
          decimal
          fractional {
            numerator
            denominator
          }
        }
        result {
          resultCode
          errorDetails
        }
      }
    }
  }
}
