query MainMarkets(
  $urn: [URN!]!
  $withFixtureUpdates: Boolean!
  $preferences: LayoutPreferencesInput
  $productExclusions: [ProductExclusion!]
  $experiments: [ExperimentsInput!]
  $throttlesOn: [String!]
  $throttlesOff: [String!]
)
@preferences(preferences: $preferences)
@productExclusions(productExclusions: $productExclusions)
@experiments(experiments: $experiments)
@throttlesOn(throttlesOn: $throttlesOn)
@throttlesOff(throttlesOff: $throttlesOff) {
  Cards(cardsURN: $urn) {
    __typename
    ... on EventMarketCard {
      ...eventMarketCardWithoutSporeventOrFixture

      fixture @include(if: $withFixtureUpdates) {
        ...fixture
      }
    }
    ... on FixtureCard @include(if: $withFixtureUpdates) {
      urn
      fixture {
        ...fixture
      }
    }
  }
}
