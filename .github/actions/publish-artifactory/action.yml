# .github/actions/publish-artifactory/action.yml
name: "Publish to artifactory"
description: "Publish an artifact to internal JFrog Artifactory"
inputs:
  artifactory_path:
    description: "Path to artifact to upload to artifactory"
    required: true
  path:
    description: "Path to upload the artifact to"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install JFrog CLI
      uses: jfrog/setup-jfrog-cli@v4
    - name: Setup JFrog CLI
      shell: bash
      run: |
        echo "::add-mask::$ART_USERNAME"
        echo "::add-mask::$ART_PASSWORD"
        jfrog config add \
          --url https://artifactory-prd.prd.betfair/ \
          --user $ART_USERNAME \
          --password $ART_PASSWORD
    - name: Publish to Artifactory
      shell: bash
      run: |
        jfrog rt upload --flat "${{inputs.path}}" ${{inputs.artifactory_path}}
        jfrog rt build-add-git
        jfrog rt build-publish
      env:
        JFROG_CLI_REPORT_USAGE: false
        JFROG_CLI_BUILD_NAME: tbd-native
