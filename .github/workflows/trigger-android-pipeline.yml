name: Trigger Android Pipeline
run-name: Trigger Android Pipeline for brand ${{ inputs.brand }}
on:
  workflow_dispatch:
    inputs:
      brand:
        type: choice
        description: Brand to build the app for
        required: true
        default: 'bf'
        options:
          - bf
          - sbg
          - pp
      run_tests:
        type: boolean
        description: Whether to run tests or not
        required: true
        default: true
      ref:
        type: string
        description: Branch or tag to build from
        required: false
        default: master

  workflow_call:
    inputs:
      brand:
        type: string
        description: Brand to build the app for
        required: true
        default: bf
      run_tests:
        type: boolean
        description: Whether to run tests or not
        required: true
        default: true
      ref:
        type: string
        description: Branch or tag to build from
        required: false
        default: master
concurrency:
  group: 'trigger-android-pipeline-${{ inputs.brand }}'
  cancel-in-progress: false
permissions: write-all

env:
  NX_BASE: origin/${{github.base_ref}}
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.get-next-build-number.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          fetch-tags: true
          sparse-checkout: |
            .github/actions/create-tag
      - name: Get next build number for brand ${{ inputs.brand }}
        id: get-next-build-number
        run: |
          git fetch --tags --force origin 'refs/tags/*:refs/tags/*'
          latest=$(git tag --list '[0-9]*-android_${{ inputs.brand }}' --sort=-v:refname | head -n1)
          if [[ -z "$latest" ]]; then
            number=0
          else
            number=${latest%%-*}
          fi
          next=$((number + 1))
          echo "build_number=$next" >> $GITHUB_OUTPUT
      - name: Create Tag in repository
        id: create-tag
        uses: ./.github/actions/create-tag
        with:
          tag-name: '${{ steps.get-next-build-number.outputs.build_number }}-android_${{ inputs.brand }}'
  run-android-pipeline:
    runs-on: ubuntu-latest
    name: Run Android pipeline for brand ${{inputs.brand}}
    needs: create-tag
    steps:
      - name: Run Android Pipeline for ${{ inputs.brand }}
        uses: actions/github-script@v7
        id: trigger-android-pipeline
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
                owner: "Flutter-Global",
                repo: "tbd",
                workflow_id: ".github/workflows/android-pipeline.yml",
                ref: "${{ github.ref_name }}",
                inputs: {
                  brand: "${{ inputs.brand }}",
                  build_number: "${{ needs.create-tag.outputs.build_number }}",
                  run_tests: "${{ inputs.brand != 'pp' && inputs.run_tests }}",
                },
              });
