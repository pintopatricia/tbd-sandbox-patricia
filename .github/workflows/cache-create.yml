name: cache-create
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  cache:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      MONTEROSA_TOKEN: ${{ secrets.MONTEROSA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Cache node dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --immutable-cache
      - uses: actions/github-script@v7
        name: Remove redundant cache
        id: cache-delete
        with:
          script: |
            const deleteOldActionCache = require('./tools/ci/delete-old-action-cache.js');
            await deleteOldActionCache(github, "${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}");
