name: Trigger IOS Pipeline
run-name: Trigger IOS Pipeline for brand ${{ inputs.brand }}${{ inputs.brand == 'bf' && format(' with run tests set to "{0}"', inputs.run_tests) || '' }}
on:
  workflow_dispatch:
    inputs:
      brand:
        type: choice
        description: Brand to build the app for
        required: true
        default: 'bf'
        options:
          - bf
          - sbg
      run_tests:
        type: boolean
        description: Whether to run tests or not
        required: true
        default: true
      ref:
        type: string
        description: Branch from which to generate the tag and build the app
        required: false
        default: 'master'
  workflow_call:
    inputs:
      brand:
        type: string
        description: Brand to build the app for
        required: true
        default: 'bf'
      run_tests:
        type: boolean
        description: Whether to run tests or not
        required: true
        default: true
      ref:
        type: string
        description: Branch from which to generate the tag and build the app
        required: false
        default: 'master'

concurrency:
  group: 'trigger-ios-pipeline-${{ inputs.brand }}'
  cancel-in-progress: false
permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.get-next-build-number.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          fetch-tags: true
          sparse-checkout: |
            .github/actions/create-tag
      - name: Get next build number for brand ${{ inputs.brand }}
        id: get-next-build-number
        run: |
          git fetch --tags --force origin 'refs/tags/*:refs/tags/*'
          latest=$(git tag --list '[0-9]*-ios_${{ inputs.brand }}' --sort=-v:refname | head -n1)
          if [[ -z "$latest" ]]; then
            number=0
          else
            number=${latest%%-*}
          fi
          next=$((number + 1))
          echo "build_number=$next" >> $GITHUB_OUTPUT
      - name: Create Tag in repository
        id: create-tag
        uses: ./.github/actions/create-tag
        with:
          tag-name: '${{ steps.get-next-build-number.outputs.build_number }}-ios_${{ inputs.brand }}'
  run-ios-pipeline:
    runs-on: ubuntu-latest
    name: Run IOS pipeline for brand ${{inputs.brand}}
    needs: create-tag
    steps:
      - name: Run IOS Pipeline for ${{ inputs.brand }}
        uses: actions/github-script@v7
        id: trigger-ios-pipeline
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
                owner: "Flutter-Global",
                repo: "tbd",
                workflow_id: ".github/workflows/ios-pipeline.yml",
                ref: "${{ github.ref_name }}",
                inputs: {
                  brand: "${{ inputs.brand }}",
                  build_number: "${{ needs.create-tag.outputs.build_number }}",
                  run_tests: "${{ inputs.run_tests }}",
                },
              });
