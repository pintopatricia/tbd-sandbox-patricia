name: delete-unused-baselines

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  delete-unused-baselines-web:
    runs-on:
      group: FlutterGithubRunners
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Detect unused baselines web
        run: |
          node ./tools/delete_unused_baselines.js baselinesRepoArg="Flutter-Global/tbd" tempBaselineRepoPathArg="packages/tbd-tests/web/specs/visual/baselines/bf/desktop_chrome" visualTestsPathArg="packages/tbd-tests/web/specs/visual/bf/"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: delete unused baselines web"
          branch: chore/delete-unused-baselines-${{ github.job }}-${{ github.run_id }}
          title: "chore: delete unused baselines - web"
          body: |
            This PR was automatically generated by the **delete-unused-baselines** workflow.
            It removes baseline files that are no longer referenced by visual tests.
          base: master
          team-reviewers: tbd-maintainers-automation
          delete-branch: true
  delete-unused-baselines-ios:
    permissions:
      contents: write
      pull-requests: write
    runs-on:
      group: FlutterGithubRunners
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Checkout baselines repo (iOS)
        uses: actions/checkout@v4
        with:
          repository: Flutter-Global/tbd-native-visual-tests-baseline
          ssh-key: ${{ secrets.DEPLOY_KEY_DELETE_BASELINES_IOS }}
          path: tbd-native-visual-tests-baseline
          fetch-depth: 1
      - name: Detect unused baselines iOS
        run: |
          node ./tools/delete_unused_baselines.js tempBaselineRepoPathArg="tbd-native-visual-tests-baseline/baselines/" visualTestsPathArg="packages/tbd-tests/native/specs/visual/bf/"
      - name: Push committed changes to master
        working-directory: tbd-native-visual-tests-baseline
        run: |
          if git diff --quiet origin/master..HEAD; then
            echo "No committed changes to push"
            exit 0
          fi
          git push origin HEAD:master
  delete-unused-baselines-android:
    runs-on:
      group: FlutterGithubRunners
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Detect unused baselines Android
        run: |
          node ./tools/delete_unused_baselines.js baselinesRepoArg="Flutter-Global/tbd" tempBaselineRepoPathArg="packages/tbd-tests/native/specs/visual/baselines/bf/android" visualTestsPathArg="packages/tbd-tests/native/specs/visual/bf/"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: delete unused baselines - android"
          branch: chore/delete-unused-baselines-${{ github.job }}-${{ github.run_id }}
          title: "chore: delete unused baselines - android"
          body: |
            This PR was automatically generated by the **delete-unused-baselines** workflow.
            It removes baseline files that are no longer referenced by visual tests.
          base: master
          team-reviewers: tbd-maintainers-automation
          delete-branch: true
