name: IOS Pipeline
run-name: IOS - ${{ inputs.brand }} - ${{ inputs.build_number }}${{ inputs.brand == 'bf' && format(' run test "{0}"', inputs.run_tests) || '' }}
on:
  workflow_dispatch:
    inputs:
      brand:
        type: choice
        description: Brand to build the app for
        required: true
        default: 'bf'
        options:
          - bf
          - sbg
      build_number:
        type: string
        description: Build number to use
        required: true
      run_tests:
        type: boolean
        description: Whether to run tests or not
        required: true
        default: true
  workflow_call:
    inputs:
      brand:
        type: string
        description: Brand to build the app for
        required: true
        default: 'bf'
      build_number:
        type: string
        description: Build number to use
        required: true
      run_tests:
        type: boolean
        description: Whether to run tests or not
        required: true
        default: true

permissions: write-all

env:
  NX_BASE: origin/${{github.base_ref}}
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  RELEASABLE_TAG: "${{ inputs.build_number }}-ios_${{ inputs.brand }}_releasable"

jobs:
  build-ios-test-app:
    if: ${{ inputs.brand == 'bf' && inputs.run_tests }}
    uses: ./.github/workflows/build-ios-app.yml
    secrets: inherit
    with:
      is_testing_app: true
      brand: ${{ inputs.brand }}
      is_deploy: true
      deploy_tag: '${{ inputs.build_number }}'
      ref: '${{ inputs.build_number }}-ios_${{ inputs.brand }}'
  ios-tests-e2e:
    if: ${{ inputs.brand == 'bf' && inputs.run_tests }}
    needs: build-ios-test-app
    uses: ./.github/workflows/ios-tests.yml
    secrets: inherit
    with:
      test_type: e2e
      brand: ${{ inputs.brand }}
      app_name: ${{ needs.build-ios-test-app.outputs.artifact_name }}
      is_merge_queue: false
      tag: '${{ inputs.build_number }}-ios_${{ inputs.brand }}'
  ios-tests-visual:
    if: ${{ inputs.brand == 'bf' && inputs.run_tests }}
    needs: build-ios-test-app
    uses: ./.github/workflows/ios-tests.yml
    secrets: inherit
    with:
      test_type: visual
      brand: ${{ inputs.brand }}
      app_name: ${{ needs.build-ios-test-app.outputs.artifact_name }}
      is_merge_queue: false
      tag: '${{ inputs.build_number }}-ios_${{ inputs.brand }}'
  build-ios-firebase-app:
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')  }}
    needs: [ios-tests-e2e, ios-tests-visual]
    uses: ./.github/workflows/build-ios-app.yml
    secrets: inherit
    with:
      is_testing_app: false
      brand: ${{ inputs.brand }}
      is_deploy: true
      deploy_tag: '${{ inputs.build_number }}'
      ref: '${{ inputs.build_number }}-ios_${{ inputs.brand }}'
  create-releasable-tag:
    if: ${{ always() && contains(needs.build-ios-firebase-app.result, 'success') }}
    runs-on: ubuntu-latest
    needs: build-ios-firebase-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/create-tag
          ref: '${{ inputs.build_number }}-ios_${{ inputs.brand }}'
      - name: Create Releasable Tag
        id: create-releasable-tag
        uses: ./.github/actions/create-tag
        with:
          tag-name: ${{ env.RELEASABLE_TAG }}
