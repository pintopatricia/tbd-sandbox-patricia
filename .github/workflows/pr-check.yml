name: pr-check
on: pull_request

# Ensures that additional commits on the same PR cancels the previous github run.
# This helps to ensure that our apps are not unnecessarily using resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  actions: write # require to delete cache

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      NX_BASE: origin/${{github.base_ref}}
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      MONTEROSA_TOKEN: ${{ secrets.MONTEROSA_TOKEN }}
    steps:
      - name: Check for merge commits
        uses: actions/github-script@v7
        id: merge-commit-ban
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if(commits.some(commit => commit.parents.length > 1)) throw "Merge Commits Forbidden"
      - name: "Calculate required fetch depth"
        run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: ${{ env.PR_FETCH_DEPTH }}
      - name: Fetch nx base branch
        uses: Flutter-Global/tbd-custom-actions/.github/custom-actions/fetch-branch@master
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Cache node dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --immutable-cache
      - name: Generate ENV files for Betfair brand
        run: |
          chmod +x tools/generate-env-files.sh
          ./tools/generate-env-files.sh --brand BF
        shell: bash
      - name: Restore NX Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ".nx"
          key: ${{ github.event.pull_request.number }}-nx-lint-cache
      - name: Run Commitlint check
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Prepare workspaces
        run: yarn prepare
      - name: Run lint
        run: yarn worktree:root:lint
      - name: Delete Previous NX Cache
        if: ${{ steps.cache-restore.outputs.cache-hit }}
        continue-on-error: true
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete "${{ github.event.pull_request.number }}-nx-lint-cache" --confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save NX Cache
        uses: actions/cache/save@v4
        with:
          path: ".nx"
          key: ${{ github.event.pull_request.number }}-nx-lint-cache
      - name: Reset soft to base branch
        run: |
          git reset --soft $NX_BASE
      - name: Run Validate Yaml Check
        run: |
          ./tools/validate_yaml.sh

  test:
    runs-on: ubuntu-latest
    env:
      RUNNING_IN_CI: true
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      NX_BASE: origin/${{github.base_ref}}
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      MONTEROSA_TOKEN: ${{secrets.MONTEROSA_TOKEN}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch nx base branch
        uses: Flutter-Global/tbd-custom-actions/.github/custom-actions/fetch-branch@master
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Cache node dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --immutable-cache
      - name: Generate ENV files for Betfair brand
        run: |
          chmod +x tools/generate-env-files.sh
          ./tools/generate-env-files.sh --brand BF
        shell: bash
      - name: Restore NX Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ".nx"
          key: ${{ github.event.pull_request.number }}-nx-test-cache
      - name: Remove canvas
        run: |
          rm -rf node_modules/canvas
      - name: Run tests
        run: |
          yarn worktree:root:test
          yarn generate:global:coverage
      - name: Delete Previous NX Cache
        if: ${{ steps.cache-restore.outputs.cache-hit }}
        continue-on-error: true
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete "${{ github.event.pull_request.number }}-nx-test-cache" --confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save NX Cache
        uses: actions/cache/save@v4
        with:
          path: ".nx"
          key: ${{ github.event.pull_request.number }}-nx-test-cache

  typecheck:
    runs-on: ubuntu-latest
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      NX_BASE: origin/${{github.base_ref}}
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      MONTEROSA_TOKEN: ${{secrets.MONTEROSA_TOKEN}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch nx base branch
        uses: Flutter-Global/tbd-custom-actions/.github/custom-actions/fetch-branch@master
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Cache node dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --immutable-cache
      - name: Generate ENV files for Betfair brand
        run: |
          chmod +x tools/generate-env-files.sh
          ./tools/generate-env-files.sh --brand BF
        shell: bash
      - name: Restore NX Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ".nx"
          key: ${{ github.event.pull_request.number }}-nx-typecheck-cache
      - name: Run typecheck
        run: yarn worktree:root:typecheck
      - name: Delete Previous NX Cache
        if: ${{ steps.cache-restore.outputs.cache-hit }}
        continue-on-error: true
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete "${{ github.event.pull_request.number }}-nx-typecheck-cache" --confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save NX Cache
        uses: actions/cache/save@v4
        with:
          path: ".nx"
          key: ${{ github.event.pull_request.number }}-nx-typecheck-cache

  validate-queries-and-dependencies:
    runs-on:
      group: FlutterGithubRunners
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      NX_BASE: origin/${{github.base_ref}}
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch nx base branch
        uses: Flutter-Global/tbd-custom-actions/.github/custom-actions/fetch-branch@master
      - name: Run dependency checker script
        run: |
          ./tools/ci/dependency_checker.sh
      - name: Reset soft to base branch
        run: |
          git reset --soft $NX_BASE
      - name: Validate extracted queries
        run: |
          ./tools/validate_extracted_queries.sh

  validate-translations:
    runs-on: ubuntu-latest
    env:
      NX_BASE: origin/${{github.base_ref}}
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      MONTEROSA_TOKEN: ${{secrets.MONTEROSA_TOKEN}}
      VALIDATION_FAILED: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch nx base branch
        uses: Flutter-Global/tbd-custom-actions/.github/custom-actions/fetch-branch@master
      - name: Check if translations updated
        id: check_changes
        run: |
          # Check if changes are in translations
          if ! git diff master --quiet -- '**/translations/*'; then
            echo "Changes detected in translations folder"
            echo "RUN_VALIDATION=true" >> $GITHUB_ENV
          else
            # Check if changes are in @ppb/tbd-components-* dependencies in tbd-shared package.json
            if ! git diff master --quiet -- 'packages/tbd-shared/package.json'; then
              if git diff -U0 master -- 'packages/tbd-shared/package.json' | grep -q '@ppb/tbd-components-'; then
                echo "Changes detected in @ppb/tbd-components-* dependencies"
                echo "RUN_VALIDATION=true" >> $GITHUB_ENV
              else
                echo "No changes in translations"
                echo "RUN_VALIDATION=false" >> $GITHUB_ENV
              fi
            else
              echo "No changes in translations"
              echo "RUN_VALIDATION=false" >> $GITHUB_ENV
            fi
          fi
      - name: Install node
        if: ${{ env.RUN_VALIDATION == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Cache node dependencies
        if: ${{ env.RUN_VALIDATION == 'true' }}
        id: cache
        uses: actions/cache@v3
        with:
          path: ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        if: ${{ env.RUN_VALIDATION == 'true' }}
        run: yarn install --immutable-cache
      - name: Restore NX Cache
        if: ${{ env.RUN_VALIDATION == 'true' }}
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ".nx"
          key: ${{ github.event.pull_request.number }}-nx-validate-translations-cache
      - name: Run validate-translations
        if: ${{ env.RUN_VALIDATION == 'true' }}
        id: validate-translations
        run: |
          output=$(node ./tools/validate-translations.js)

          if [[ "$output" != "" ]]; then
          echo "Translations validation failed."
          echo "VALIDATION_FAILED=true" >> $GITHUB_ENV
          fi

          { echo "result<<EOF"
          echo "# Translations Validation :books:"
          echo ""
          echo "$output"
          echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Post log to PR
        if: ${{ env.RUN_VALIDATION == 'true' }}
        uses: actions/github-script@v7
        env:
          RESULT: ${{steps.validate-translations.outputs.result}}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = process.env.RESULT
            if (process.env.VALIDATION_FAILED == 'true') {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                issue_number: context.issue.number,
                repo: context.repo.repo,
                body: result
              });
            }
      - name: Delete Previous NX Cache
        if: ${{ steps.cache-restore.outputs.cache-hit }}
        continue-on-error: true
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete "${{ github.event.pull_request.number }}-nx-validate-translations-cache" --confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save NX Cache
        if: ${{ env.RUN_VALIDATION == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ".nx"
          key: ${{ github.event.pull_request.number }}-nx-validate-translations-cache
      - name: Fail if translations validation failed
        if: ${{ env.VALIDATION_FAILED == 'true' }}
        run: exit 1

  xray-lint:
    runs-on: ubuntu-latest
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      NX_BASE: origin/${{ github.base_ref }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MONTEROSA_TOKEN: ${{ secrets.MONTEROSA_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch base branch
        uses: Flutter-Global/tbd-custom-actions/.github/custom-actions/fetch-branch@master

      - name: Get changed E2E spec files (web)
        id: changed_web
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/web/specs/e2e/**
            **/web/specs/regression/**
            **/web/specs/visual/**

      - name: Get changed spec files (native)
        id: changed_native
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/native/specs/e2e/**
            **/native/specs/regression/**
            **/native/specs/visual/**

      - name: Prepare flags
        id: prep
        run: |
          echo "has_web=${{ steps.changed_web.outputs.any_changed }}" >> "$GITHUB_OUTPUT"
          echo "web_files=${{ steps.changed_web.outputs.all_changed_files }}" >> "$GITHUB_OUTPUT"

          echo "has_native=${{ steps.changed_native.outputs.any_changed }}" >> "$GITHUB_OUTPUT"
          echo "native_files=${{ steps.changed_native.outputs.all_changed_files }}" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.changed_web.outputs.any_changed }}" != "true" ] && [ "${{ steps.changed_native.outputs.any_changed }}" != "true" ]; then
            echo "has_any=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install node
        if: ${{ steps.prep.outputs.has_any == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Cache node dependencies
        if: ${{ steps.prep.outputs.has_any == 'true' }}
        id: cache
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: ${{ steps.prep.outputs.has_any == 'true' }}
        run: yarn install --immutable-cache

      - name: Run native XRAY lint (only changed native spec files)
        id: native_lint
        if: ${{ steps.prep.outputs.has_native == 'true' }}
        continue-on-error: true
        run: |
          echo "Changed native files:"
          for f in ${{ steps.prep.outputs.native_files }}; do echo "$f"; done

          yarn native:xray:lint -- --files ${{ steps.prep.outputs.native_files }}
          code=$?

          if [ $code -ne 0 ]; then
            echo ""
            echo "👉 To fix native tests, run:"
            echo "yarn native:xray:sync"
            echo ""
            exit $code
          fi

      - name: Run Web XRAY lint (only changed web spec files)
        id: web_lint
        if: ${{ steps.prep.outputs.has_web == 'true' }}
        continue-on-error: true
        run: |
          echo "Changed web spec files:"
          for f in ${{ steps.prep.outputs.web_files }}; do echo "$f"; done

          yarn web:xray:lint -- --files ${{ steps.prep.outputs.web_files }}
          code=$?

          if [ $code -ne 0 ]; then
            echo ""
            echo "👉 To fix web tests, run:"
            echo "yarn web:xray:sync"
            echo ""
            exit $code
          fi

      - name: Fail if any XRAY lint failed
        if: ${{ always() && steps.prep.outputs.has_any == 'true' }}
        run: |
          native="${{ steps.native_lint.outcome }}"
          web="${{ steps.web_lint.outcome }}"
          echo "native_lint_outcome=$native"
          echo "web_lint_outcome=$web"
          if [ "$native" = "failure" ] || [ "$web" = "failure" ]; then
            echo ""
            echo "❌ XRAY lint failed. Please run the sync command: yarn web:xray:sync, commit the changes and push to the PR to fix the lint errors."
            exit 2
          fi

      - name: Skip message (no relevant changes)
        if: ${{ steps.prep.outputs.has_any != 'true' }}
        run: echo "No changes in web/native specs. Skipping XRAY lint."
