name: web-tests
run-name: Web - ${{ inputs.brand }} - ${{ inputs.test_type }} - ${{ inputs.pr_id }}

on:
  workflow_call:
    inputs:
      test_type:
        required: true
        type: string
        description: Type of test to run
      brand:
        required: false
        default: "bf"
        type: string
        description: Brand against which to run the tests
      script_extension:
        required: true
        type: string
        description: The end of the script to run
      base_url:
        required: true
        type: string
        description: Base URL for the tests
      pr_id:
        required: false
        type: string
      is_merge_queue:
        type: boolean
        description: Has been kicked off by the merge queue
        required: false
        default: true
      commit_status_context:
        type: string
        description: Context for the commit status
        required: false
      comment_id:
        required: false
        type: string

  workflow_dispatch:
    inputs:
      test_type:
        required: true
        type: choice
        description: Type of test to run
        options:
          - regression-tests
          - e2e-tests
          - visual-tests
      brand:
        required: false
        default: "bf"
        type: string
        description: Brand against which to run the tests
      script_extension:
        required: true
        type: string
        description: Type of test to run (see scripts in package.json)
      base_url:
        required: true
        type: string
        description: Base URL for the tests
      pr_id:
        type: string
        description: PR the comment is made on
        required: true
      is_merge_queue:
        type: boolean
        description: Has been kicked off by the merge queue
        required: false
        default: false
      comment_id:
        type: string
        description: ID of the comment that triggered the workflow
        required: false

concurrency:
  group: "web-test-${{ inputs.brand }}-${{ inputs.test_type }}-${{ inputs.brand }}-${{ inputs.pr_id || github.ref_name }}"
  cancel-in-progress: true

env:
  VAULT_USER: ${{ secrets.VAULT_USER }}
  VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MONTEROSA_TOKEN: ${{ secrets.MONTEROSA_TOKEN }}

jobs:
  build-web-app:
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
    runs-on:
      group: FlutterGithubRunners
    timeout-minutes: 20
    if: ${{ !contains(inputs.test_type, 'e2e') }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Running Workflow URL
        id: workflow-url
        run: |
          echo "workflow_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

      - name: Update initialisation comment
        if: ${{ inputs.comment_id }}
        uses: actions/github-script@v7
        id: initialisation-comment
        with:
          script: |
            const commentId = "${{ inputs.comment_id }}";
            const workflowUrl = "${{ steps.workflow-url.outputs.workflow_url }}";
            const { data: existingComment } = await github.rest.issues.getComment({
              owner: "Flutter-Global",
              repo: "tbd",
              comment_id: commentId
            });

            const updatedBody = `> ${existingComment.body}\n\n ⏳ Web ${{ inputs.test_type }} tests for brand ${{ inputs.brand }} are running - [click to view](${workflowUrl})`;
            await github.rest.issues.updateComment({
              owner: "Flutter-Global",
              repo: "tbd",
              comment_id: commentId,
              body: updatedBody
            });
            return existingComment.body;

      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: "Flutter-Global",
              repo: "tbd",
              sha: "${{ github.sha }}",
              state: "pending",
              description: "Web tests are running, click to view",
              target_url: "${{ steps.workflow-url.outputs.workflow_url }}",
              context: "${{ inputs.commit_status_context }}" || "${{ inputs.test_type }} tests for ${{ inputs.brand }} on demand for PR"
            });

      - name: Call build web app action
        id: build-web-app
        if: ${{ !contains(inputs.base_url, 'https://') }}
        uses: ./.github/actions/build-web-app
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_MERGE_QUEUE }}

      - name: Set Outputs
        id: set-outputs
        run: |
          echo "url=${{ contains(inputs.base_url, 'https://') && inputs.base_url || steps.build-web-app.outputs.url }}" >> $GITHUB_OUTPUT

    outputs:
      url: ${{ steps.set-outputs.outputs.url }}
      initialisation_comment: ${{ steps.initialisation-comment.outputs.result }}

  run_test:
    needs: build-web-app
    if: always()
    timeout-minutes: 20
    continue-on-error: true
    runs-on: centos-self-hosted-large
    permissions: write-all
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISABLE_V8_COMPILE_CACHE: 1
      ghprbPullId: ${{ inputs.pr_id }}
    outputs:
      failed: ${{ steps.run-tests.outputs.failed }}
      passed: ${{ steps.run-tests.outputs.passed }}
      total: ${{ steps.run-tests.outputs.total }}
      environment: ${{ steps.resolve-env.outputs.environment }}
      started_at: ${{ steps.exec_start.outputs.started_at }}
      finished_at: ${{ steps.exec_end.outputs.finished_at }}
      duration_seconds: ${{ steps.exec_end.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::509882276346:role/AWS20_GithubOidcRole-repo"
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          role-skip-session-tagging: true
          aws-region: eu-west-1

      - name: Cache node modules
        id: node-cache
        uses: runs-on/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
          RUNS_ON_S3_BUCKET_CACHE: "tbd-github-runner-s3-bucket-cache"
          AWS_REGION: "eu-west-1"

      - name: Enable corepack
        run: corepack enable yarn

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: yarn install
        shell: bash

      - name: Pre test steps
        run: yarn prepare && yarn generate-config-files

      - name: Capture execution start (UTC)
        id: exec_start
        shell: bash
        run: |
          echo "started_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Run ${{ inputs.test_type }} (see here if tests have failed)
        id: run-tests
        run: |
          NODE_TLS_REJECT_UNAUTHORIZED=0 SELENIUM_HOST=ie2-tbdlsg01-qa.qa.betfair MAX_INSTANCES=5 NUM_SPEC_RETRIES=1 BAIL_LIMIT=10 BASE_URL="${{ needs.build-web-app.outputs.url }}" yarn ${{ inputs.script_extension }} | tee test-results.log
          EXIT_CODE=${PIPESTATUS[0]}
          SUMMARY_LINE=$(grep "Spec Files:" test-results.log || true)
          echo "$SUMMARY_LINE"
          PASSED=$(echo "$SUMMARY_LINE" | grep -o '[0-9]\+ passed' | cut -d' ' -f1)
          FAILED=$(echo "$SUMMARY_LINE" | grep -o '[0-9]\+ failed' | cut -d' ' -f1)
          TOTAL=$(echo "$SUMMARY_LINE" | grep -o '[0-9]\+ total' | cut -d' ' -f1)
          echo "Passed: $PASSED"
          echo "Failed: $FAILED"
          echo "Total: ${TOTAL:-0}"
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Fail the step if any tests failed
          if [ "${FAILED:-0}" != "0" ]; then
            echo "❌ Tests failed: ${FAILED} test(s) failed"
              exit 1
          fi
      - name: Capture execution end + duration (UTC)
        id: exec_end
        if: ${{ always() }}
        shell: bash
        run: |
          end_epoch=$(date -u +%s)
          finished_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          start_epoch="${{ steps.exec_start.outputs.started_epoch }}"
          if [ -z "${start_epoch}" ]; then
            start_epoch=$end_epoch
          fi

          duration_seconds=$(( end_epoch - start_epoch ))
          if [ "$duration_seconds" -lt 0 ]; then duration_seconds=0; fi

          echo "finished_at=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "duration_seconds=${duration_seconds}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        name: Archive test results
        id: archive-results
        if: always()
        with:
          name: "web-tests-results-${{ inputs.brand }}-${{ inputs.test_type }}-${{ inputs.pr_id || github.ref_name }}"
          path: reports/allure-results

      - name: Resolve test environment
        id: resolve-env
        if: ${{ always() }}
        shell: bash
        run: |
          SCRIPT='${{ inputs.script_extension }}'

          if [[ "$SCRIPT" == *"nxt"* ]]; then ENV="nxt"
          elif [[ "$SCRIPT" == *"qa"* ]]; then ENV="qa"
          elif [[ "$SCRIPT" == *"drk"* ]]; then ENV="drk"
          else ENV="prd"
          fi

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Resolved environment: $ENV"

      - name: Archive JUnit results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: "web-tests-junit-${{ inputs.brand }}-${{ inputs.test_type }}-${{ inputs.pr_id || github.ref_name }}"
          path: reports/junit
          if-no-files-found: error

      - name: Raise PR for Baseline changes
        if: ${{ always() && steps.run-tests.outputs.failed != '0' && !inputs.is_merge_queue && (inputs.test_type == 'visual-tests') }}
        id: raise-baseline-pr
        run: |
          echo "Baseline changes detected"
          echo "Raising PR for baseline changes"

          git config --global user.name "svc-aws-automation"
          git config --global user.email "cloud.automation@paddypowerbetfair.com"

          if [[ "${{ inputs.test_type }}" == "visual-tests" ]]; then
            baselinesFolder="baselines/bf";
            echo "Baselines folder: $baselinesFolder"
            GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD) sh tools/ci/update-baselines.sh packages/tbd-tests/web/specs/visual $baselinesFolder
          fi

      - name: Update commit status
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const failed = "${{ steps.run-tests.outputs.failed }}";
            console.log(typeof failed);
            const state = "${{ steps.run-tests.outputs.failed }}" != '0' ? 'failure' : 'success';
            await github.rest.repos.createCommitStatus({
              owner: "Flutter-Global",
              repo: "tbd",
              sha: "${{ github.sha }}",
              state,
              description: "Web tests are finished, click to view",
              target_url: "${{ steps.workflow-url.outputs.workflow_url }}",
              context: "${{ inputs.commit_status_context }}" || "${{ inputs.test_type }} tests for ${{ inputs.brand }} on demand for PR"
            });

  run_allure:
    needs: [run_test]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/allure.yml
    with:
      results_folder_name: "web-tests-results-${{ inputs.brand }}-${{ inputs.test_type }}-${{ inputs.pr_id || github.ref_name }}"
      test_type: ${{ inputs.test_type }}
      brand: ${{ inputs.brand }}
      history_group: ${{ inputs.pr_id || github.ref_name }}
      platform: "web"

  allure_summary_comment:
    runs-on: ubuntu-latest
    needs: [run_test, run_allure]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Post summary to PR
        if: ${{ always() && inputs.comment_id && !inputs.is_merge_queue }}
        env:
          PR_ID: ${{ inputs.pr_id }}
          TEST_TYPE: ${{ inputs.test_type }}
          BRAND: ${{ inputs.brand }}
          RUN_ID: ${{ github.run_id }}
          INITIALISATION_COMMENT: ${{ needs.build-web-app.outputs.initialisation_comment }}
          COMMENT_ID: ${{ inputs.comment_id }}
          passed: ${{ needs.run_test.outputs.passed }}
          failed: ${{ needs.run_test.outputs.failed }}
          total: ${{ needs.run_test.outputs.total }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { passed, failed, total } = process.env;
            const { owner, repo } = context.repo;
            const issue_number = process.env.PR_ID;
            const allure_url = `https://awsdxrstbd-bucket.s3.eu-west-1.amazonaws.com/allure-report/web/${process.env.BRAND}/${process.env.TEST_TYPE}/${process.env.PR_ID}/${process.env.RUN_ID}/index.html`;
            const status = parseInt(failed) > 0 ? '❌ Failure' : '✅ Success';
            const initialisationComment = process.env.INITIALISATION_COMMENT.replace(/"/g, '');

            const { data: existingComment } = await github.rest.issues.getComment({
              owner,
              repo,
              comment_id: process.env.COMMENT_ID,
            });

            // removes the XXX tests are running text from the PR comment
            const regex = new RegExp(`⏳.*?${process.env.TEST_TYPE}.*\\n?`, 'g');
            const cleanedBody = existingComment.body.replace(regex, '');

            // Adds the results to the comment
            const commentBody = [
              `${cleanedBody}\n\n`,
              `**Allure Test Results Summary - Web ${process.env.TEST_TYPE} ${process.env.BRAND}**`,
              `Status: ${status}`,
              `[GH Actions Run](https://github.com/${owner}/${repo}/actions/runs/${process.env.RUN_ID}) | [Allure report](${allure_url})`,
              `- **Passed tests**: ${passed}`,
              `- **Failed tests**: ${failed}`,
              `- **Total tests**: ${total}`,
            ].join('\n');

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: process.env.COMMENT_ID,
              body: commentBody,
            });

      - name: Generate Summary
        if: always()
        run: |
          echo "**Web ${{ inputs.test_type }} for PR: ${{ inputs.pr_id }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.run_test.outputs.failed }}" = "0" ]; then
            echo "✅ Success - 0 tests failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Failure - ${{ needs.run_test.outputs.failed }} tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Allure report](https://awsdxrstbd-bucket.s3.eu-west-1.amazonaws.com/allure-report/web/${{ inputs.brand }}/${{ inputs.test_type }}/${{ inputs.pr_id }}/${{ github.run_id }}/index.html) | [PR Link](https://github.com/Flutter-Global/tbd/pull/${{ inputs.pr_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Error on test failure
        run: |
          if [ "${{ needs.run_test.outputs.failed }}" != "0" ]; then
            echo "${{ needs.run_test.outputs.failed }} tests failed. See 'Run ${{ inputs.test_type }}' step or Allure report for details."
            exit 1
          fi

      - name: Send Slack Notification (Failure)
        if: ${{ failure() && inputs.is_merge_queue }}
        uses: ./.github/actions/slack-notification
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_MERGE_QUEUE }}
          job-name: ${{ inputs.test_type }}
          allure-report-url: https://awsdxrstbd-bucket.s3.eu-west-1.amazonaws.com/allure-report/web/${{ inputs.brand }}/${{ inputs.test_type }}/${{ inputs.pr_id }}/${{ github.run_id }}/index.html

      - name: Cancel workflow run (Failure)
        if: ${{ failure() && inputs.is_merge_queue }}
        uses: actions/github-script@v6
        with:
          script: |
            const response = await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            console.log("Workflow canceled:", response.data);

  trigger_xray_import:
    needs: [run_test]
    if: ${{ !cancelled() && needs.run_test.outputs.tests_executed == 'true' && !inputs.is_merge_queue }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger Xray import workflow asynchronously
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const dispatchRef = process.env.GITHUB_REF_NAME || '';

            const workflowInputs = {
              source_run_id: "${{ github.run_id }}",
              junit_artifact_name: "web-tests-junit-${{ inputs.brand }}-${{ inputs.test_type }}-${{ inputs.pr_id || github.ref_name }}",
              jira_project_key: "PRPI",
              pr_id: "${{ inputs.pr_id || '' }}",
              test_type: testType,
              brand: "${{ inputs.brand }}",
              environment: "${{ needs.run_test.outputs.environment }}",
              platform: "web",
              execution_started_at: "${{ needs.run_test.outputs.started_at || '' }}",
              execution_finished_at: "${{ needs.run_test.outputs.finished_at || '' }}",
              execution_duration_seconds: "${{ needs.run_test.outputs.duration_seconds || '' }}"
            };

            if (testType === "regression-tests") {
              workflowInputs.batch_size = "15";
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "xray-import.yml",
              ref: dispatchRef,
              inputs: workflowInputs
            });
