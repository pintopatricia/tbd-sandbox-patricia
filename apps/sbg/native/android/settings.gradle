pluginManagement { includeBuild("../../../../node_modules/@react-native/gradle-plugin")
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}
plugins { id("com.facebook.react.settings")
id("expo-autolinking-settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand) }
rootProject.name = "tbd_native"
include ':betfair.cetmodule'
project(':betfair.cetmodule').projectDir = new File(rootProject.projectDir, '../../../../node_modules/@flutter-global/react-native-cet-framework/android')
include ":react-native-notifications"
project(":react-native-notifications").projectDir = new File("../../../../node_modules/react-native-notifications/lib/android/app")
include ':react-native-in-app-review'
project(':react-native-in-app-review').projectDir = new File("../../../../node_modules/react-native-in-app-review/android")
include ':flutter-global_react-native-geo-comply-sdk-wrapper'
project(':flutter-global_react-native-geo-comply-sdk-wrapper').projectDir = new File(rootProject.projectDir, '../../../../node_modules/@flutter-global/react-native-geo-comply-sdk-wrapper/android')
include ':geocomply'

include ":app"
expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()
