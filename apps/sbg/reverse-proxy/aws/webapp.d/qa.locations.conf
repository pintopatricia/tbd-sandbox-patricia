
location @redirect_home {
  return 302 https://$host/;
}

location @redirect_sso {
    return 302 https://identitysso.skybet.com/view/login?product=sportsbook&prod=110&url=https%3A%2F%2Flocalhost.skybet.com.qa.ppbdev.com%3A8080$request_uri&redirectMethod=GET;
}

# "/catalog" - proxy to "catalogue API/strand" (graphql version)
location ~ /api/tbd/bff-gql/v(\d+)(.*)$ {
    proxy_pass http://bff-gql/api$2$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header Origin "www.skybet.com";
    proxy_pass_request_headers on;
}

location ~ /api/tbd/bff-gql/v(\d+)(.*)$ {
    proxy_pass http://bff-gql/api$2$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header Origin "www.skybet.com";
    proxy_pass_request_headers on;
}

# "/catalog" - proxy to catalogue API latest (graphql version)
location ~ /api/tbd/bff-gql/latest(.*)$ {
    proxy_pass http://bff-gql/api$2$is_args$args;
    proxy_set_header Host $host;
    proxy_pass_request_headers on;
}

# "/sca" - proxy to "SCA(Sports Content API)" (graphql version)
location ~ /graphql(.*)$ {
    proxy_method POST;
    proxy_pass http://scasbg.prd.internal/graphql$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Origin "";
}

# "/Customer behaviour library" - proxy to cbs service
location ~ /CustomerBehaviourService/v2.0(.*)$ {
    proxy_method POST;
    proxy_pass https://cbs.skybet.drk.internal/CustomerBehaviourService/v2.0$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/launcher" - proxy to "Gaming Launcher"
location ~ /launcher(.*)$ {
    proxy_method GET;
    proxy_pass http://launcher.skybet.$proxy_host_domain/$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Origin "";
}

# "/smp" - proxy to SMP service
