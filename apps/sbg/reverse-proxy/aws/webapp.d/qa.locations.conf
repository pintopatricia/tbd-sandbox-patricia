# "/was" - proxy to WAS service
location ~ /wallet-service/v3.0(.*)$ {
    proxy_method GET;
    proxy_pass http://wassbg.prd.internal/wallet-service/v3.0$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/search" - proxy to Global Search service
location ~ /api/gfe/search-games/v1/search-games(.*)$ {
    proxy_method GET;
    proxy_pass http://gfesbg.prd.internal/api/gfe/search-games/v1/search-games$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Application "9Fs5bFQ2XfGSPgep";
}

# "/myAccountNavigation" - proxy to WAS service
location ~ /api/myAccountNavigation(.*)$ {
    proxy_method GET;
    proxy_pass https://maxsbg.prd.internal/api/myAccountNavigation$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/live dealer websocket" - proxy to Live Dealer service
location ~ /api/gfe/fanout/v2/(.*)$ {
    proxy_method GET;
    proxy_pass https://gfesbg.prd.internal/api/gfe/fanout/v2/$is_args$args;
    proxy_pass_request_headers on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# "/setPreferences" - proxy to USP service
location ~ /usp-preferences/v1.0/setUserPreferences(.*)$ {
    proxy_method POST;
    proxy_pass http://uspsbg.prd.internal/usp-preferences/v1.0/setUserPreferences$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Application "9Fs5bFQ2XfGSPgep";
    proxy_set_header X-Authentication $cookie_ssoid;
}

# "/ssccontent" - proxy to SSC service to get the help and learn links
location ~ /api/sscContent(.*)$ {
    proxy_method GET;
    proxy_pass https://sscsbg.prd.internal/api/v2.0/content$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Client-Name "native";
    proxy_set_header X-Client-Version "2";
}

# "/api/v1.0/content" - proxy to SSC service to get the header and footer (for desktop header)
location ~ /api/v1.0/content(.*)$ {
    proxy_method POST;
    proxy_pass https://sscsbg.prd.internal/api/v1.0/content$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/cashout-service" - proxy to COS (readonly and transactional)
location ~ /cashout-service/(.*)/v1/(.*)$ {
    proxy_method GET;
    proxy_pass http://cos.prd.internal/cashout-service/$1/v1.0/$2$is_args$args;
    proxy_pass_request_headers on;
}

location ~ /SportsbookEventReadOnlyService/v1/(.*)$ {
    proxy_method GET;
    proxy_pass http://sersbg.prd.internal/SportsbookEventReadOnlyService/v1/$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/fcq-service" - proxy to FCQ (Fixedodds Cashout service)
location ~ /fcq-service/v0(.*)$ {
    proxy_method GET;
    proxy_pass http://fcqsbg.prd.internal/fcq-service/v0$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Authentication $cookie_ssoid;
}

# "/fixedodds/transactional/v1/cashoutBet" - proxy to SCO (Fixedodds Transactional Sportsbook cashout service)
location ~ /www/sports/fixedodds/transactional/v1/cashoutBet(.*)$ {
    proxy_method POST;
    proxy_pass http://scosbg.prd.internal/www/sports/fixedodds/transactional/v1/cashoutBet$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/fixedodds/transactional/v1/freezeBet" - proxy to SCO (Fixedodds Transactional Sportsbook cashout service) freeze bet
location ~ /www/sports/fixedodds/transactional/v1/freezeBet(.*)$ {
    proxy_method POST;
    proxy_pass https://scosbg.prd.internal/api/sports/fixedodds/transactional/v1.2/freezeBet$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Host $host;
    proxy_set_header X-Application "9Fs5bFQ2XfGSPgep";
    proxy_set_header X-Authentication $cookie_ssoid;
}

# "/tbd/assets/*" - "any" wildcard - proxy to static server for serving static assets (JS, CSS, images...)
location ~* /tbd/assets/(.*)$ {
    proxy_pass http://webserver/$1$is_args$args;
    proxy_pass_request_headers on;
}

location ~ ^/betting/env.json {
  alias /usr/share/nginx/app.environment.json;
  add_header Cache-Control "public";
  expires max;
}

# "/api/logout*" - proxy to iSSO service
location ~ /proxy/identitysso/api/logout(.*)$ {
    # Fix redirect URL in response body
    sub_filter 'https://www.skybet.com/' '$scheme://$host/';

    if ($host ~* ^(www\.)?([^.]+).(.+)$) {
        set $subdomain $3;
    }
    proxy_cookie_domain .prd.internal $subdomain;
    proxy_set_header Host ssosbg.prd.internal;
    proxy_pass $scheme://ssosbg.prd.internal/api/logout$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/api/login*" - proxy to iSSO service
location ~ /proxy/identitysso/api/login(.*)$ {
    # Fix redirect URL in response body
    sub_filter 'https%3A%2F%2Fwww.skybet.com' '$scheme://$host/';

    if ($host ~* ^(www\.)?([^.]+).(.+)$) {
        set $subdomain $3;
    }
    proxy_cookie_domain .prd.internal $subdomain;
    proxy_set_header Host ssosbg.prd.internal;
    proxy_pass $scheme://ssosbg.prd.internal/api/login$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/view/login" proxy to identitySSO page
location ~* /proxy/identitysso/view/login(.*)$ {
    proxy_method GET;
    set $path $1;

    # this will replace all occurrences of '/api/login' to '/proxy/identitysso/api/login'
    sub_filter 'https://ssosbg.prd.internal/api/login' 'https://$host/proxy/identitysso/api/login';
    sub_filter '"/resources/' '"/proxy/identitysso/resources/';
    sub_filter_once on;

    if ($host ~* ^(www\.)?([^.]+).(.+)$) {
        set $subdomain $3;
    }
    # Rewrite cookie domain to
    proxy_cookie_domain .prd.internal $subdomain;

    proxy_set_header Host ssosbg.prd.internal;
    proxy_pass $scheme://ssosbg.prd.internal/view/login?redirectMethod=GET&product=sportsbook&prod=110&sessionVerified=true&url=https://www.skybet.com;
    proxy_pass_request_headers on;
}

# "/LoadRunnerInfoChartAction" - proxy to XTSD service
location ~ /LoadRunnerInfoChartAction(.*)$ {
    proxy_method GET;
    proxy_pass https://xtsd.qa.internal/LoadRunnerInfoChartAction/$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/ws*" - proxy static server (webpack-dev-server for HMR)
location ~ ^/ws.*$ {
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;

    proxy_pass http://webserver:9001$1$is_args$args;

    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# "/handleBannerAction" - proxy to MAX service
location ~ /myaccountx/rest/handleBannerAction(.*)$ {
    proxy_method POST;
    proxy_pass https://maxsbg.prd.internal/myaccountx/rest/handleBannerAction$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Host $host;
    proxy_set_header X-Application "9Fs5bFQ2XfGSPgep";
    proxy_set_header X-Authentication $cookie_ssoid;
}

# "/bet/mutationEligibility" - proxy to BME service
location ~ /bet/mutationEligibility(.*)$ {
    proxy_method GET;
    proxy_pass http://bmesbg.prd.internal/bet/mutationEligibility$1$is_args$args;
    proxy_pass_request_headers on;
}

location / {
    proxy_pass http://http-webserver/api?requestHost=$http_host;
    proxy_pass_request_headers on;
    proxy_set_header Host $http_host;
    proxy_set_header X-Application "9Fs5bFQ2XfGSPgep";
    proxy_set_header X-Request-URI $request_uri;
    proxy_intercept_errors on;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Cache-Control "private, max-age=0, s-maxage=0, no-cache, no-store, no-transform, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    error_page 400 404 406 500 503 = @redirect_home;
    error_page 401 403 = @redirect_sso;
}
