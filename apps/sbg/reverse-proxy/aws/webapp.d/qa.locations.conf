    proxy_pass_request_headers on;
    proxy_set_header X-IP "10.83.126.9"; # should be temporary until SIB supports any IP within the VPN
}

location ~ /www/sports/fixedodds-lite/transactional/v1/implyBets(.*)$ {
    proxy_method POST;
    proxy_pass http://siblitesbg.prd.internal/www/sports/fixedodds/transactional/v1/implyBets$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-IP "10.83.126.9"; # should be temporary until SIB supports any IP within the VPN
