version: "3.4"
services:
  webserver:
    image: ppb/tbdsbg/web/prod/webserver
    build:
      context: ${PWD}/../../../
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
        - MONTEROSA_TOKEN=${MONTEROSA_TOKEN}
      dockerfile: apps/sbg/web/Docker/prod_mode/webserver.Dockerfile
  http-webserver:
    image: ppb/tbd/bff/http-webserver
    build:
      context: ${PWD}/../../../
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
        - MONTEROSA_TOKEN=${MONTEROSA_TOKEN}
        - BRAND=sbg
        - ENVIRONMENT=qa
      dockerfile: apps/tbd-http-webserver/prod.Dockerfile
    volumes:
      - ${PWD}/../../../apps/tbd-http-webserver/config/certificates:/etc/bf-fabric/certificates/
      - ${PWD}/../../../apps/tbd-http-webserver/config/config-http.json:/etc/bf-fabric/config-http.json
      - ${PWD}/../../../apps/tbd-http-webserver/lib/config/environment.json:/fabric/deploy/tbd-http-webserver/dist/tbd-http-webserver-v1/lib/config/environment.json:ro
  bff-gql:
    image: docker.app.betfair/ppb/tbd/bff/bff-gql:local
    ports:
      - "8082:8082"
    volumes:
      - ${PWD}/../../../apps/bf-tbd-http-bff-gql/config/certificates:/etc/bf-fabric/certificates
      - ${PWD}/../../../apps/bf-tbd-http-bff-gql/config/bff-gql-http-sbg-qa.json:/etc/bf-fabric/bff-gql-http.json
      - ${PWD}/../../../apps/bf-tbd-http-bff-gql/src/config:/app/dist/config

  reverseproxy:
    image: ppb/tbdsbg/web/prod/reverseproxy-local
    build:
      context: ${PWD}/../../../
      dockerfile: apps/sbg/web/Docker/prod_mode/reverseproxy.Dockerfile
    depends_on:
      - bff-gql
      - webserver
    ports:
      - "80:80"
      - "443:443"
