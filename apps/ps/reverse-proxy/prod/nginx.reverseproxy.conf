worker_processes auto;

events {
    worker_connections 1024;
}

http {
   include       /etc/nginx/mime.types;
   default_type  application/octet-stream;

   access_log  /var/log/nginx/tbd-access.log;
   error_log   /var/log/nginx/tbd-error.log warn;

   sendfile on;
   log_not_found on;
   merge_slashes on;

    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;


    gunzip on;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain
               text/xml
               text/css
               image/svg+xml
	       image/png
               image/jpeg
               application/octet-stream
               application/xml
               application/xhtml+xml
               application/rss+xml
               application/atom_xml
               application/jsonwelcome
               application/javascript
	       application/json
               application/x-javascript;

    upstream webserver {
    	server webserver:9001;
    }

    upstream bff-gql {
    	server bff-gql:8082; # external service
    }

    upstream http-webserver {
    	server http-webserver:8081; # external service
    }

    map $http_host $proxy_host_domain {
        default com;
        .es$ es;
        .it$ it;
        .ro$ ro;
        .br$ bet.br;
    }

    server {
        server_name localhost.pokerstars.com;
        listen 80;
        listen *:443 ssl http2;
        proxy_buffering on;
        proxy_buffers 128 8k;
        proxy_buffer_size 8k;
        proxy_busy_buffers_size 8k;

        ssl_certificate /etc/nginx/ssl-cert/localhost.pokerstars.com-cert.pem;
        ssl_certificate_key /etc/nginx/ssl-cert/localhost.pokerstars.com-key.pem;

        port_in_redirect off;

        resolver 127.0.0.11;

        include /etc/nginx/conf.d/nginx.locations.conf;
    }
}
