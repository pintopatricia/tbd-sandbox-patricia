apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"
apply plugin: "org.sonarqube"
apply plugin: "com.google.firebase.firebase-perf"

import com.android.build.OutputFile
import java.text.SimpleDateFormat

/**
 * Set the monorepo root path.
 */
def rootDir = file("$projectDir/../../../../../")

/**
 * Code Push must use React properties to identify node_modules.
 */
project.ext.nodeModulesPath = "$rootDir/node_modules"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don"t need to apply any configuration, just uncomment the lines you need.
 */
react {
    reactNativeDir = file("$rootDir/node_modules/react-native")
    codegenDir = file("$rootDir/node_modules/@react-native/codegen")
    cliFile = file("$rootDir/node_modules/react-native/cli.js")
    entryFile = file("$rootDir/apps/bf/native/index.js")
    hermesCommand = "$rootDir/node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/*
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * Override `hermesEnabled` by `expo.jsEngine` so the native engine selection
 * matches the engine `expo export` targets for OTA bundles
 */
ext {
    hermesEnabled = (findProperty('expo.jsEngine') ?: "hermes") == "hermes"
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    ndkPath System.getenv("ANDROID_NDK_HOME")
    namespace "com.betfair.tbd"

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId APK.basePackageName
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName System.getenv("NATIVE_BUILD_NUMBER")
        multiDexEnabled true
    }

    compileOptions {
      coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "bundle"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("ANDROID_UPLOAD_STORE_PW")
            keyAlias System.getenv("ANDROID_KEYSTORE_ALIAS")
            keyPassword System.getenv("ANDROID_UPLOAD_STORE_PW")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir "native/android/app/build/intermediates/merged_native_libs/playRelease/out/lib"
            }
            ndk {
                abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
                debugSymbolLevel "FULL"
            }
        }
        releaseBrazil {
            applicationIdSuffix ".sportsbook.brazil"
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            matchingFallbacks = ["release"]
            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir "native/android/app/build/intermediates/merged_native_libs/playRelease/out/lib"
            }
            ndk {
                abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
                debugSymbolLevel "FULL"
            }
        }
        inhouse {
            applicationIdSuffix ".tbd.inhouse"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
        }
        debug {
            applicationIdSuffix ".tbd.qa"
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "default"

    productFlavors {
        play
        betfair {
            applicationId "com.betfair"
        }
        betfairBrazil {
            applicationId "com.betfair"
        }
    }

    variantFilter { variant ->
        // Disable betfairBrazil non-release variants
        if (variant.flavors.any { it.name == "betfairBrazil" } && variant.buildType.name != "release") {
            variant.ignore = true
        }

        if (variant.flavors.any { it.name == "betfair" } && variant.buildType.name == "releaseBrazil") {
            variant.ignore = true
        }
    }

    def versionCode = buildVersionCode()
    // applicationVariants are e.g. debug, release
    applicationVariants.all { variant ->

        variant.resValue "string", "splashVersionCode", "v." + versionCode.toString()
        variant.outputs.each { output ->
            output.versionCodeOverride = versionCode

            if(variant.buildType.name == "release") {
                if (variant.productFlavors[0].name == "betfairBrazil") {
                    variant.mergedFlavor.applicationId = "com.betfair.sportsbook.brazil"
                } else {
                    variant.mergedFlavor.applicationId = "com.betfair.sportsbook"
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation fileTree(dir: 'libs', include: ['quantum*.aar'])

    api(platform("com.squareup.okhttp3:okhttp-bom:4.9.1"))
    api("com.squareup.okhttp3:okhttp")
    api("com.squareup.okhttp3:logging-interceptor")

    implementation "com.facebook.android:facebook-android-sdk:18.0.3"

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // gif
    implementation "com.facebook.fresco:fresco:3.4.0"
    implementation "com.facebook.fresco:animated-gif:3.4.0"

    // for geoComply
    implementation project(':geocomply')
    implementation project(':flutter-global_react-native-geo-comply-sdk-wrapper')
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Adobe Marketing Push Notifications
    implementation "com.adobe.marketing.mobile:core:2.6.1"
    implementation "com.adobe.marketing.mobile:campaignclassic:2.0.1"

    implementation "com.squareup.picasso:picasso:2.5.2"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    implementation "com.google.firebase:firebase-messaging:24.0.0"
    implementation "com.google.firebase:firebase-perf"

    implementation project(":react-native-notifications")
    implementation project(':react-native-in-app-review')
    implementation project(":react-native-onetrust-cmp")

    // Monterosa SDKs
    def sdkVersion = '0.16.17'
    implementation("co.monterosa.sdk:core:${sdkVersion}")
    implementation("co.monterosa.sdk:launcherkit:${sdkVersion}")
    implementation("co.monterosa.sdk:identifykit:${sdkVersion}")

    // Signalfx
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

// Run this once to be able to run the application with BUCK
// puts all compile dependencies into folder libs for BUCK to use
task copyDownloadableDepsToLibs(type: Copy) {
    from configurations.implementation
    into "libs"
}

apply plugin: 'kotlin-android'
apply plugin: "com.splunk.rum-httpurlconnection-auto-plugin"
apply plugin: "com.splunk.rum-okhttp3-auto-plugin"

def buildVersionCode() {
    if (System.getenv("NATIVE_BUILD_NUMBER")) {
        return Integer.parseInt(System.getenv("NATIVE_BUILD_NUMBER"))
    } else {
        // default so the forced/suggested screen is not displayed for local envs
        return 3000000
    }
}
