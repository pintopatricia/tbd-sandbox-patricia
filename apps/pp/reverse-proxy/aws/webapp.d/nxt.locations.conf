# "/was" - proxy to WAS service
location ~ /wallet-service/v3.0(.*)$ {
    proxy_method GET;
    proxy_pass http://waspp.nxt.internal/wallet-service/v3.0$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/search" - proxy to Global Search service
location ~ /api/gfe/search-games/v1/search-games(.*)$ {
    proxy_method GET;
    proxy_pass http://gfepp.nxt.internal/api/gfe/search-games/v1/search-games$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Application "La6LWokES0cmKroF";
}

# "/myAccountNavigation" - proxy to WAS service
location ~ /api/myAccountNavigation(.*)$ {
    proxy_method GET;
    proxy_pass https://maxpp.nxt.internal/api/myAccountNavigation$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/setPreferences" - proxy to USP service
location ~ /usp-preferences/v1.0/setUserPreferences(.*)$ {
    proxy_method POST;
    proxy_pass https://usppp.nxt.internal/usp-preferences/v1.0/setUserPreferences$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Application "La6LWokES0cmKroF";
    proxy_set_header X-Authentication $cookie_ssoid;
}

location ~ /api/sscContent(.*)$ {
    proxy_method GET;
    proxy_pass https://sscpp.nxt.internal/api/v2.0/content$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Client-Name "native";
    proxy_set_header X-Client-Version "2";
}

# "/api/v1.0/content" - proxy to SSC service to get the header and footer (for desktop header)
location ~ /api/v1.0/content(.*)$ {
    proxy_method POST;
    proxy_pass https://sscpp.nxt.internal/api/v1.0/content$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/LoadRunnerInfoChartAction" - proxy to XTSD service
location ~ /LoadRunnerInfoChartAction(.*)$ {
    proxy_method GET;
    proxy_pass https://xtsd.nxt.internal/LoadRunnerInfoChartAction/$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/Customer behaviour library" - proxy to cbs service
location ~ /CustomerBehaviourService/v2.0(.*)$ {
    proxy_method POST;
    proxy_pass https://cbspp.nxt.internal/CustomerBehaviourService/v2.0$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/live dealer websocket" - proxy to Live Dealer service
location ~ /api/gfe/fanout/v2/(.*)$ {
    proxy_method GET;
    proxy_pass http://gfepp.nxt.internal/api/gfe/fanout/v2/$is_args$args;
    proxy_pass_request_headers on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# "/tbd/assets/*" - "any" wildcard - proxy to static server for serving static assets (JS, CSS, images...)
location ~* /tbd/assets/(.*)$ {
    proxy_pass http://webserver/$1$is_args$args;
    proxy_pass_request_headers on;
}

location ~ ^/env.json {
  alias /usr/share/nginx/app.environment.json;
  add_header Cache-Control "public";
  expires max;
}

# "/api/login*", "/api/logout*", "/api/keepAlive*" - proxy to iSSO service
location ~ /proxy/identitysso/api/(login|logout|keepAlive)(.*)$ {
    proxy_cookie_domain .drk.com.paddypower $host;
    proxy_pass $scheme://identitysso.drk.com.paddypower/api/$1?redirectMethod=GET&product=bfrebuild&prod=90&url=https://www.paddypower.com.drk.ppbdev.com/;
    proxy_pass_request_headers on;
    proxy_redirect https://www.paddypower.com.drk.ppbdev.com/ $scheme://$host/;
}

# proxy to identitySSO page resources
location ~* /proxy/identitysso/(resources|page)/(.*)$ {
    proxy_method GET;

    sub_filter '/page/' '/proxy/identitysso/page/';
    sub_filter_once off;
    sub_filter_types *;

    proxy_pass $scheme://identitysso.drk.com.paddypower/$1/$2$is_args$args;
    proxy_pass_request_headers on;
}

# proxy to identitySSO page
location ~* /proxy/identitysso/(.*)$ {
    proxy_method GET;
    set $path $1;

    # this will replace all occurrences of '/api/login' to '/proxy/identitysso/api/login'
    sub_filter '/api/login' '/proxy/identitysso/api/login';
    sub_filter '"/resources/' '"/proxy/identitysso/resources/';
    sub_filter_once on;

    proxy_pass $scheme://identitysso.drk.com.paddypower/$path?redirectMethod=GET&product=bfrebuild&prod=90&url=https://www.paddypower.com.drk.ppbdev.com/;
    proxy_pass_request_headers on;
}

# "/handleBannerAction" - proxy to MAX service
location ~ /myaccountx/rest/handleBannerAction(.*)$ {
    proxy_method POST;
    proxy_pass http://maxpp.nxt.internal/myaccountx/rest/handleBannerAction$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Host $host;
    proxy_set_header X-Application "La6LWokES0cmKroF";
    proxy_set_header X-Authentication $cookie_ssoid;
}

# "/cashout-service" - proxy to COS (readonly and transactional)
location ~ /cashout-service/(.*)/v1/(.*)$ {
    proxy_method GET;
    proxy_pass http://cos.nxt.internal/cashout-service/$1/v1.0/$2$is_args$args;
    proxy_pass_request_headers on;
}

# "/fcq-service" - proxy to FCQ (Fixedodds Cashout service)
location ~ /fcq-service/v0(.*)$ {
    proxy_method GET;
    proxy_pass http://fcqpp.nxt.internal/fcq-service/v0$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/fixedodds/transactional/v1/cashoutBet" - proxy to SCO (Fixedodds Transactional Sportsbook cashout service)
location ~ /www/sports/fixedodds/transactional/v1/cashoutBet(.*)$ {
    proxy_method POST;
    proxy_pass http://scopp.nxt.internal/www/sports/fixedodds/transactional/v1/cashoutBet$1$is_args$args;
    proxy_pass_request_headers on;
}

# All TBD Routes
location  ~ /(.*)$ {
    proxy_pass http://http-webserver/api?requestHost=$http_host;
    proxy_pass_request_headers on;
    proxy_set_header Host $http_host;
    proxy_set_header X-Application "La6LWokES0cmKroF";
    proxy_set_header X-Request-URI $request_uri;
    proxy_intercept_errors on;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Cache-Control "private, max-age=0, s-maxage=0, no-cache, no-store, no-transform, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    error_page 400 404 406 500 503 = @redirect_home;
    error_page 401 403 = @redirect_sso;
}
