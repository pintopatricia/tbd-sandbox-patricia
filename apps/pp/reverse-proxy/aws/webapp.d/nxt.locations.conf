    proxy_pass_request_headers on;
}

# "/ser" - proxy to SER service
location ~ /SportsbookEventReadOnlyService/v1(.*)$ {
    proxy_method GET;
    proxy_pass http://serpp.nxt.internal/SportsbookEventReadOnlyService/v1$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/smdbf" - proxy to SMD service
location ~ /SeoMetadata/v1(.*)$ {
    proxy_method POST;
    proxy_pass https://smdpp.nxt.internal/SeoMetadata/v1$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/etx" - proxy to ETX service
location ~ /www/sports/exchange/transactional/v1(.*)$ {
    proxy_method POST;
    proxy_pass http://etx.nxt.internal/www/sports/exchange/transactional/v1$1$is_args$args;
    proxy_pass_request_headers on;
}

location ~ /www/sports/fixedodds/transactional/v1/placeBet(.*)$ {
    proxy_method POST;
    proxy_pass http://spbpp.nxt.internal/www/sports/fixedodds/transactional/v1/placeBet$1$is_args$args;
