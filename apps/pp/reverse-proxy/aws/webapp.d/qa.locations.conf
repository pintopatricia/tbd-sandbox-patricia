location @redirect_home {
    return 302 https://$host/;
}

location @redirect_sso {
    return 302 https://identitysso.paddypower.com/view/login?product=sportsbook&prod=90&url=https%3A%2F%2Flocalhost.paddypower.com.qa.ppbdev.com%3A8080$request_uri&redirectMethod=GET;
}

# "/catalog" - proxy to "catalogue API/strand" (graphql version)
location ~ /api/tbd/bff-gql/v(\d+)(.*)$ {
    proxy_pass http://bff-gql/api$2$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header Origin "www.paddypower.com";
    proxy_pass_request_headers on;
}

location ~ /api/tbd/bff-gql/v(\d+)(.*)$ {
    proxy_pass http://bff-gql/api$2$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header Origin "www.paddypower.com";
    proxy_pass_request_headers on;
}

# "/catalog" - proxy to catalogue API latest (graphql version)
location ~ /api/tbd/bff-gql/latest(.*)$ {
    proxy_pass http://bff-gql/api$2$is_args$args;
    proxy_set_header Host $host;
    proxy_pass_request_headers on;
}

# "/blh/graphql" - proxy to BLH (Bet Live Hypotheticals)
location ~ blh/graphql(.*)$ {
    proxy_method POST;
    proxy_pass https://blhbf.prd.internal/graphql$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Origin "https://www.paddypower.com";
}

# "/sca" - proxy to "SCA(Sports Content API)" (graphql version)
location ~ /graphql(.*)$ {
    proxy_method POST;
    proxy_pass http://scapp.prd.internal/graphql$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Origin "";
}

# "/Customer behaviour library" - proxy to cbs service
location ~ /CustomerBehaviourService/v2.0(.*)$ {
    proxy_method POST;
    proxy_pass https://cbspp.prd.internal/CustomerBehaviourService/v2.0$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/launcher" - proxy to "Gaming Launcher"
location ~ /launcher(.*)$ {
    proxy_method GET;
    proxy_pass http://launcher.paddypower.$proxy_host_domain/$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Origin "";
}

# "/ero" - proxy to ERO service
location ~ /www/sports/exchange/readonly/v1(.*)$ {
    proxy_method GET;
    proxy_pass http://ero.prd.internal/www/sports/exchange/readonly/v1$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/smp" - proxy to SMP service
location ~ /www/sports/fixedodds/readonly/v1(.*)$ {
    proxy_method POST;
    proxy_pass http://smppp.prd.internal/www/sports/fixedodds/readonly/v1$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/smdbf" - proxy to SMD service
location ~ /SeoMetadata/v1(.*)$ {
    proxy_method POST;
    proxy_pass https://smdpp.prd.internal/SeoMetadata/v1$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/etx" - proxy to ETX service
location ~ /www/sports/exchange/transactional/v1(.*)$ {
    proxy_method POST;
    proxy_pass http://etx.prd.internal/www/sports/exchange/transactional/v1$1$is_args$args;
    proxy_pass_request_headers on;
}

location ~ /www/sports/fixedodds/transactional/v1/placeBet(.*)$ {
    proxy_method POST;
    proxy_pass http://spbpp.prd.internal/www/sports/fixedodds/transactional/v1/placeBet$1$is_args$args;
    proxy_pass_request_headers on;
}

location ~ /www/sports/fixedodds/transactional/v1/implyBets(.*)$ {
    proxy_method POST;
    proxy_pass http://sibpp.prd.internal/www/sports/fixedodds/transactional/v1/implyBets$1$is_args$args;
    proxy_pass_request_headers on;
}

location ~ /www/sports/fixedodds-lite/transactional/v1/implyBets(.*)$ {
    proxy_method POST;
    proxy_pass http://siblitepp.prd.internal/www/sports/fixedodds/transactional/v1/implyBets$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/was" - proxy to WAS service
location ~ /wallet-service/v3.0(.*)$ {
    proxy_method GET;
    proxy_pass http://waspp.prd.internal/wallet-service/v3.0$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/search" - proxy to Global Search service
location ~ /api/gfe/search-games/v1/search-games(.*)$ {
    proxy_method GET;
    proxy_pass http://gfepp.prd.internal/api/gfe/search-games/v1/search-games$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Application "La6LWokES0cmKroF";
}

# "/myAccountNavigation" - proxy to WAS service
location ~ /api/myAccountNavigation(.*)$ {
    proxy_method GET;
    proxy_pass https://maxpp.prd.internal/api/myAccountNavigation$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/live dealer websocket" - proxy to Live Dealer service
location ~ /api/gfe/fanout/v2/(.*)$ {
    proxy_method GET;
    proxy_pass https://gfepp.prd.internal/api/gfe/fanout/v2/$is_args$args;
    proxy_pass_request_headers on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# "/setPreferences" - proxy to USP service
location ~ /usp-preferences/v1.0/setUserPreferences(.*)$ {
    proxy_method POST;
    proxy_pass http://usppp.prd.internal/usp-preferences/v1.0/setUserPreferences$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Application "La6LWokES0cmKroF";
    proxy_set_header X-Authentication $cookie_ssoid;
}

# "/ssccontent" - proxy to SSC service to get the help and learn links
location ~ /api/sscContent(.*)$ {
    proxy_method GET;
    proxy_pass https://sscpp.prd.internal/api/v2.0/content$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header X-Client-Name "native";
    proxy_set_header X-Client-Version "2";
}

# "/api/v1.0/content" - proxy to SSC service to get the header and footer (for desktop header)
location ~ /api/v1.0/content(.*)$ {
    proxy_method POST;
    proxy_pass https://sscpp.prd.internal/api/v1.0/content$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/lbr" - proxy to LBR service
location ~ /www/sports/exchange/reporting/live/v1(.*)$ {
    proxy_method GET;
    proxy_pass http://lbr.prd.internal/www/sports/exchange/reporting/live/v1$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/cashout-service" - proxy to COS (readonly and transactional)
location ~ /cashout-service/(.*)/v1/(.*)$ {
    proxy_method GET;
    proxy_pass http://cos.prd.internal/cashout-service/$1/v1.0/$2$is_args$args;
    proxy_pass_request_headers on;
}

location ~ /SportsbookEventReadOnlyService/v1/(.*)$ {
    proxy_method GET;
    proxy_pass http://serpp.prd.internal/SportsbookEventReadOnlyService/v1/$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/fcq-service" - proxy to FCQ (Fixedodds Cashout service)
location ~ /fcq-service/v0(.*)$ {
    proxy_method GET;
    proxy_pass http://fcqpp.prd.internal/fcq-service/v0$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/fixedodds/transactional/v1/cashoutBet" - proxy to SCO (Fixedodds Transactional Sportsbook cashout service)
location ~ /www/sports/fixedodds/transactional/v1/cashoutBet(.*)$ {
    proxy_method POST;
    proxy_pass http://scopp.prd.internal/www/sports/fixedodds/transactional/v1/cashoutBet$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/tbd/assets/*" - "any" wildcard - proxy to static server for serving static assets (JS, CSS, images...)
location ~* /tbd/assets/(.*)$ {
    proxy_pass http://webserver/$1$is_args$args;
    proxy_pass_request_headers on;
}

location ~ ^/env.json {
  alias /usr/share/nginx/app.environment.json;
  add_header Cache-Control "public";
  expires max;
}

# "/api/login*", "/api/logout*", "/api/keepAlive*" - proxy to iSSO service
location ~ /proxy/identitysso/api/(login|logout|keepAlive)(.*)$ {
    proxy_pass https://identitysso.paddypower.com/api/$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_redirect https://www.paddypower.com/ $scheme://$host/;
}

# proxy to identitySSO page
location ~* /proxy/identitysso/(.*)$ {
    return 301 $scheme://identitysso.paddypower.com/$1$is_args$args;
}

# "/LoadRunnerInfoChartAction" - proxy to XTSD service
location ~ /LoadRunnerInfoChartAction(.*)$ {
    proxy_method GET;
    proxy_pass https://xtsd.prd.internal/LoadRunnerInfoChartAction/$1$is_args$args;
    proxy_pass_request_headers on;
}

# "/ws*" - proxy static server (webpack-dev-server for HMR)
location ~ ^/ws.*$ {
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;

    proxy_pass http://webserver$1$is_args$args;

    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# "/handleBannerAction" - proxy to MAX service
location ~ /myaccountx/rest/handleBannerAction(.*)$ {
    proxy_method POST;
    proxy_pass http://maxpp.prd.internal/myaccountx/rest/handleBannerAction$1$is_args$args;
    proxy_pass_request_headers on;
    proxy_set_header Host $host;
    proxy_set_header X-Application "La6LWokES0cmKroF";
    proxy_set_header X-Authentication $cookie_ssoid;
}

location  ~ /(.*)$ {
    proxy_pass http://http-webserver/api?requestHost=$http_host;
    proxy_pass_request_headers on;
    proxy_set_header Host $http_host;
    proxy_set_header X-Application "La6LWokES0cmKroF";
    proxy_set_header X-Request-URI $request_uri;
    proxy_intercept_errors on;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Cache-Control "private, max-age=0, s-maxage=0, no-cache, no-store, no-transform, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    error_page 400 404 406 500 503 = @redirect_home;
    error_page 401 403 = @redirect_sso;
}
